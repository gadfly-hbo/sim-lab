function reviewBlock(){return `<div class="review-box"><div><strong>${state.confirmed===state.revision?'✓ 当前工作稿的口径已确认':'先确认假设，再运行实验'}</strong><p>确认模型适合本次讨论；不代表参数来自真实业务或结果已获批准。</p></div>${btn(state.confirmed===state.revision?'查看已确认口径':'查看并确认口径','confirm',state.confirmed===state.revision?'':'primary')}</div>`;}
function parameters(){const fields=(keys)=>`<div class="field-grid">${keys.map(k=>{const f=FIELD_MAP[k];return `<div class="field"><label for="${k}">${f[1]}</label><input type="number" id="${k}" name="${k}" min="${f[3]}" max="${f[4]}" step="${f[5]}" value="${state.params[k]}" ${state.status==='running'||unresolved()?'disabled':''}><small>${f[2]} · ${fmt(f[3])}–${fmt(f[4])}</small></div>`;}).join('')}</div>`;return `<form id="paramForm"><section class="subsection"><div class="subhead"><h2>共同经营参数</h2>${tag('窗口固定为 30 天','neutral')}</div><p class="note" style="margin:0 0 18px">保存后更新同一工作稿；原运行固定保留，相关口径确认失效。</p>${fields(['demand','inventory','capacity','leadTime','promo','extraStock','maxWait','cash'])}</section><section class="subsection"><div class="subhead"><h3>费用与现金口径</h3></div>${fields(['price','cost','fulfillmentCost','holdingCost','cashThreshold','backlogThreshold'])}</section><section class="subsection"><h3>外部冲击 · 对三种方案同时生效</h3><label class="checkrow"><input type="checkbox" id="demandShock" ${state.params.demandShock?'checked':''} ${state.status==='running'||unresolved()?'disabled':''}><div>需求上行 30%<p>D8–D21 需求乘 1.30，与方案促销乘数相乘。</p></div></label><label class="checkrow"><input type="checkbox" id="supplyShock" ${state.params.supplyShock?'checked':''} ${state.status==='running'||unresolved()?'disabled':''}><div>供货延迟 3 天<p>D1、D8、D15、D22 四笔采购均增加 3 天；D0 现货不变。</p></div></label><p class="note">采购数量固定为基准需求 × 7，不因冲击自动加单。参数页修改基准需求会改变此固定政策；敏感性中的需求扰动则冻结原采购政策。</p></section><div id="paramError" class="form-error" role="alert"></div><div class="footer-actions"><span class="fine" id="editStatus">保存才生效；未保存时暂停运行与导出。</span>${btn('放弃编辑','discard-edit')}${btn('保存参数','save-params','primary',state.status==='running'||unresolved()?'disabled':'')}</div></form>`;}
function assistant(){let proposal='';if(state.proposal){const p=state.proposal,expired=p.baseRevision!==state.revision;proposal=`<div class="delta"><h3>${expired?'建议已过期':'修改建议 · 待采纳'}</h3><p class="fine">基于工作稿 r${p.baseRevision}，尚未改变当前参数。</p>${Object.entries(p.patch).map(([k,v])=>`<div class="delta-row"><span class="old">${FIELD_MAP[k]?.[1]||({demandShock:'需求冲击',supplyShock:'供货延迟'}[k])}：${formatParam(k,p.before?.[k]??state.params[k])}</span><span class="next">→ ${formatParam(k,v)}</span></div>`).join('')}<div class="impact-metrics"><strong>原内核计算的影响预览</strong><br>基准方案：现金低点 ${signed(p.impact.cash)} 元<br>贡献毛利 ${signed(p.impact.contribution)} 元<br>取消 ${signed(p.impact.cancelled)} 单</div><p class="fine">${esc(p.note)}<br>采纳后须重新确认口径并运行三方案。预览不是正式运行结果。</p><div class="actions">${btn('采纳修改','adopt','primary small',expired||state.status==='running'||unresolved()?'disabled':'')}${btn('放弃','discard-proposal','small quiet')}</div></div>`;}
return `<aside class="assistant" aria-label="实验共创助手"><div class="assistant-head"><span class="spark">✧</span><h3>一起完善</h3><small>脚本 Agent</small></div><div class="assistant-label">围绕同一份实验工作稿</div><div class="assistant-message">先把目标变成假设与参数。修改先看差异和计算影响，采纳后再进入工作稿。</div>${state.chat.slice(-2).map(m=>`<div class="assistant-message ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')}${proposal||`<div class="suggestions">${['将日发货能力改为300','关闭供货延迟','解释当前风险'].map(s=>`<button class="suggestion" data-action="suggest" data-text="${s}">${s} ↗</button>`).join('')}</div>`}<div class="assistant-compose"><label for="refine">用自然语言说说你想怎么改</label><textarea id="refine" placeholder="例如：将日发货能力改为300" ${state.status==='running'||unresolved()?'disabled':''}></textarea><div class="assistant-send"><span class="fine">先看建议，再采纳</span>${btn('发送 ↑','refine','primary small',state.status==='running'||unresolved()?'disabled':'')}</div></div><details><summary>支持哪些输入？</summary><p>将「基准需求 / 日发货能力 / 初始现金 / 额外备货 / 采购提前期 / 促销增幅 / 最大等待」改为数字；开启或关闭「需求冲击 / 供货延迟」；解释当前风险。其他内容会提示不支持。</p></details><p class="no-external">预设脚本模拟理解与解释。<br>Pi / LLM 未连接 · 无模型费用</p></aside>`;}
function formatParam(k,v){return typeof v==='boolean'?(v?'开启':'关闭'):fmt(v)+(FIELD_MAP[k]?' '+FIELD_MAP[k][2].split(' · ')[0]:'');}
function results(){if(!state.run)return `<div class="empty"><div class="eyebrow">实验还未运行</div><h2>先对齐口径，再看真实计算。</h2><p>运行后在同一环境下比较三种方案；每个结果都能追溯到输入和逐日账。</p>${reviewBlock()}${btn('运行三种方案','run','primary',canRun()?'':'disabled')}</div>`;
const r=state.run.payload, sc=state.selected,s=r.results[sc].summary,p=r.parameters;
return `<div class="subhead"><div><h2>同一压力下，比较三种选择</h2><p class="fine" style="margin-top:6px">${esc(r.id)} · 输入 r${state.run.revision} · ${r.validationPassed?'守恒通过':'守恒失败'} · ${isCurrent()?'当前结果':'历史结果'}</p></div>${tag('确定性仿真')}</div><div class="table-scroll"><table aria-label="三方案比较"><thead><tr><th>方案</th><th>现金低点</th><th>贡献毛利</th><th>取消 / 未受理</th><th>首触护栏</th></tr></thead><tbody>${SCENARIOS.map(c=>{const x=r.results[c.id].summary;return `<tr class="${sc===c.id?'selected':''}"><td><button class="link" data-action="scenario" data-scenario="${c.id}">${c.name}</button></td><td>${money(x.minCash)}</td><td>${money(x.contribution)}</td><td>${fmt(x.cancelled)} / ${fmt(x.unaccepted)}</td><td>${x.firstThreshold===null?'未触发':'D'+x.firstThreshold}</td></tr>`;}).join('')}</tbody></table></div><p class="note">贡献毛利已扣商品成本与变动履约费，未扣持有费；它不等于现金增量或净利润。</p><div class="scenario-tabs">${SCENARIOS.map(c=>`<button class="scenario-btn ${sc===c.id?'active':''}" data-action="scenario" data-scenario="${c.id}" aria-pressed="${sc===c.id}">${c.name}</button>`).join('')}</div><div class="metrics"><div class="metric"><span class="label">日末现金低点（含 D0）</span><strong title="${s.minCash}">${money(s.minCash)}</strong><small>D${s.minCashDay} · 底线 ${money(p.cashThreshold)}</small></div><div class="metric"><span class="label">累计贡献毛利</span><strong>${money(s.contribution)}</strong><small>发货 ${fmt(s.shipped)} 件</small></div><div class="metric"><span class="label">积压峰值</span><strong>${fmt(s.peakBacklog)} <small>件</small></strong><small>D${s.peakBacklogDay} · 上限 ${fmt(p.backlogThreshold)}</small></div></div><section class="subsection"><div class="subhead"><h3>沿着每天，看见约束出现</h3><div class="chart-switch">${[['backlog','队列 / 件'],['inventory','库存 / 件'],['cash','现金 / 元']].map(([k,l])=>`<button class="${state.chart===k?'active':''}" data-action="chart" data-chart="${k}">${l}</button>`).join('')}</div></div><div class="chart-wrap">${chart(r,sc)}</div><div class="day-summary"><strong>D${state.day} · ${SCENARIOS.find(c=>c.id===sc).name}日账</strong>${btn('查看完整日账','ledger','small quiet')}</div><label class="fine" for="daySlider">选择 D0–D30 查看当天状态</label><input id="daySlider" class="day-slider" type="range" min="0" max="30" step="1" value="${state.day}">${dayLedger(r,sc)}<p class="fine">选日查看：到货 → 接单 → FIFO 发货 → 超时取消 → 费用及采购付款 → 日末状态。</p></section><section class="subsection"><div class="subhead"><h3>风险什么时候越过护栏</h3>${btn('查看证据 →','tab','small quiet','data-tab="evidence"')}</div>${riskRows(r,sc)}<div class="scope-note ${s.firstThreshold!==null?'warn':''}">${explain(r,sc)}</div></section>`;}
function chart(r,sc){const key=state.chart,p=r.parameters,x=r.results[sc];const initial={cash:x.summary.openingCash,inventory:x.summary.openingInventory,backlog:0,day:0};const arr=[initial,...x.records];const threshold=key==='cash'?p.cashThreshold:key==='backlog'?p.backlogThreshold:null;const vals=arr.map(v=>v[key]);if(threshold!==null)vals.push(threshold);let lo=Math.min(0,...vals),hi=Math.max(...vals,1);const range=hi-lo;hi+=range*.12;lo-=range*.03;const X=d=>45+d/30*610,Y=v=>185-(v-lo)/(hi-lo)*155;const points=arr.map(d=>X(d.day)+','+Y(d[key])).join(' ');return `<svg class="chart" viewBox="0 0 680 225" role="img" aria-label="${key==='cash'?'日末现金，元':key==='inventory'?'日末库存，件':'日末积压，件'}逐日曲线；下方可用滑块逐日查看"><rect x="${X(8)}" y="22" width="${X(21)-X(8)}" height="163" fill="#f1f4ec"/><text x="${X(8)+7}" y="17">D8–D21 需求冲击窗口${p.demandShock?'':'（未开启）'}</text>${[0,.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="45" x2="655" y1="${Y(v)}" y2="${Y(v)}" stroke="#dce2d9"/><text x="39" y="${Y(v)+3}" text-anchor="end">${Math.abs(v)>=10000?Math.round(v/1000)+'k':fmt(v)}</text>`;}).join('')}${threshold!==null?`<line x1="45" x2="655" y1="${Y(threshold)}" y2="${Y(threshold)}" stroke="#ad7d38" stroke-dasharray="4 4"/><text x="655" y="${Y(threshold)-5}" text-anchor="end">护栏 ${fmt(threshold)}</text>`:''}<polyline points="${points}" fill="none" stroke="#27664f" stroke-width="2.4" stroke-linejoin="round"/><line x1="${X(state.day)}" x2="${X(state.day)}" y1="22" y2="185" stroke="#7f9782" stroke-dasharray="3 4"/><circle cx="${X(state.day)}" cy="${Y(arr[state.day][key])}" r="4" fill="#27664f" stroke="#fff" stroke-width="2"/>${[0,8,14,21,30].map(d=>`<text x="${X(d)}" y="207" text-anchor="middle">D${d}</text>`).join('')}</svg>`;}
function dayLedger(r,sc){const d=state.day===0?{received:r.results[sc].summary.extraStock,accepted:0,shipped:0,cancelled:0,inventory:r.results[sc].summary.openingInventory,backlog:0,purchasePayment:r.parameters.cost*r.results[sc].summary.extraStock,cash:r.results[sc].summary.openingCash}:r.results[sc].records[state.day-1];return `<div class="ledger">${[['到货',d.received,'件'],['接单',d.accepted,'单'],['发货',d.shipped,'件'],['超时取消',d.cancelled,'单'],['日末现货',d.inventory,'件'],['日末积压',d.backlog,'件'],['采购付款',money(d.purchasePayment),''],['日末现金',money(d.cash),'']].map(([l,v,u])=>`<div><span>${l}</span><strong>${typeof v==='number'?fmt(v):v} ${u}</strong></div>`).join('')}</div>`;}
function riskRows(r,sc){const x=r.results[sc],s=x.summary,p=r.parameters;const cashDays=x.records.filter(d=>d.cash<p.cashThreshold).length+(s.openingCash<p.cashThreshold?1:0),backDays=x.records.filter(d=>d.backlog>p.backlogThreshold).length;return [['现金低于底线',s.firstCash,cashDays,'日末现金，含 D0'],['积压超过上限',s.firstBacklog,backDays,'仅日末未发订单'],['现货不足以支撑可发需求',s.firstStockout,s.stockoutDays,'受库存限制的日数']].map(([l,d,n,note])=>`<div class="risk-row"><div>${l}<small>${note}</small></div><div>${d===null?'未触发':`<button class="link" data-action="risk-day" data-day="${d}">首触 D${d}</button> · 共 ${n} 天`}</div></div>`).join('')+`<div class="subsection"><h3>窗口末尾仍有哪些状态</h3><div class="ledger"><div><span>潜在需求发货率</span><strong>${pct(s.fulfillmentRate)}</strong></div><div><span>已接单发货率</span><strong>${pct(s.acceptedFulfillmentRate)}</strong></div><div><span>已接单取消率</span><strong>${pct(s.cancelRate)}</strong></div><div><span>期末现货 / 占款</span><strong>${fmt(s.closingInventory)} / ${money(s.inventoryValue)}</strong></div><div><span>期末在途 / 占款</span><strong>${fmt(s.inTransit)} / ${money(s.inTransitValue)}</strong></div><div><span>未完成队列</span><strong>${fmt(s.closingBacklog)} 单</strong></div><div><span>持有费</span><strong>${money(s.holding)}</strong></div><div><span>模型经营结余</span><strong>${money(s.operatingBalance)}</strong></div></div><p class="fine">分母为 0 时显示“不适用”。现货、在途是期末资产；队列保留未完成状态，不强制清算。模型经营结余未含税费、固定费用等，不是净利润。</p></div>`;}
function explain(r,sc){const s=r.results[sc].summary;return `${SCENARIOS.find(x=>x.id===sc).name}：${s.firstThreshold===null?'本窗口未触及设定的现金或积压护栏。':`D${s.firstThreshold} 首次触及护栏，需检查该日库存、采购付款与订单队列。`}${s.firstNegative!==null?`D${s.firstNegative} 起出现负现金；后续是忽略融资约束继续推演的条件结果。`:''}取消 ${fmt(s.cancelled)} 单，未受理 ${fmt(s.unaccepted)} 单，期末仍有 ${fmt(s.closingBacklog)} 单待发。${sc==='advance'?'额外现货降低供货暴露，同时在 D0 提前消耗现金。':sc==='split'?'限量压低队列，也可能放弃需求机会。':'集中需求同时受到库存和发货能力约束。'}这是合成假设下的取舍，不是无条件推荐。`;}
function evidence(){const r=state.run?.payload,sc=state.selected;return `<section class="subsection"><div class="subhead"><h2>每个判断，都有计算依据</h2>${tag('内核 v0.1 原样复用','neutral')}</div><p class="note" style="margin-top:0">界面 v0.2；模型仍为 simlab-daily-fifo-0.1.0。公式、日内顺序与敏感性政策未变。</p><dl class="definition"><dt>现金与贡献毛利分开</dt><dd>现金 = 前日现金 + 发货收款 − 采购付款 − 履约费 − 持有费。贡献毛利 = 发货件数 ×（售价 − 商品成本 − 履约费）。</dd><dt>采购下单付款，货发收款</dt><dd>D1 / D8 / D15 / D22 各采购 round(基准需求 × 7) 件。初始库存期前已付；提前备货 D0 同时增加现货和扣现金。到货不重复付款。</dd><dt>守恒与阈值</dt><dd>现货、订单、在途、需求分解与现金可逐日复核。现金严格小于底线，积压严格大于上限；日内最低现金未建模。</dd><dt>真实单变量敏感性</dt><dd>需求 ±20%、能力 −20%、提前期 +2 天分别独立重跑。冻结采购日和采购量；分批方案的原接单上限也冻结，避免一次扰动偷偷改变多个政策。</dd></dl></section>${r?`<section class="subsection"><div class="subhead"><h3>${SCENARIOS.find(s=>s.id===sc).name} · 运行证据</h3>${btn('完整日账','ledger','small')}</div><div class="status-list">${[['现货 / 订单 / 现金逐日守恒',r.results[sc].checks.every(c=>c.valid),'30 天残差在容差内'],['窗口需求分解',r.results[sc].summary.demand===r.results[sc].summary.shipped+r.results[sc].summary.cancelled+r.results[sc].summary.closingBacklog+r.results[sc].summary.unaccepted,'需求 = 发货 + 取消 + 未完成 + 未受理'],['三方案及敏感性计算',r.validationPassed,'同一输入快照与模型版本']].map(([l,pass,n])=>`<div class="status-row"><b>${pass?'✓':'!'}</b><div>${l}<small>${n}</small></div>${tag(pass?'通过':'失败',pass?'':'warn')}</div>`).join('')}</div><div class="table-scroll"><table aria-label="单变量敏感性"><thead><tr><th>单变量扰动</th><th>现金低点变化</th><th>首触护栏</th><th>守恒</th></tr></thead><tbody>${r.sensitivity[sc].map(s=>`<tr><td>${s.label}</td><td>${signed(s.deltaMinCash)} 元</td><td>${s.firstThreshold===null?'未触发':'D'+s.firstThreshold}</td><td>${s.validationPassed?'通过':'失败'}</td></tr>`).join('')}</tbody></table></div><p class="note">以上对应 ${r.id} / r${state.run.revision}，${isCurrent()?'与当前工作稿一致':'当前工作稿已有修改，仅可作为历史依据'}。</p></section>`:'<div class="scope-note">尚无运行证据。确认参数并运行后，才出现日账与敏感性数值。</div>'}<section class="subsection"><h3>计算身份与来源</h3><p class="mono">model: simlab-daily-fifo-0.1.0<br>core SHA-256: ${CORE_HASH}<br>source: v0.1 Library 评审包，全部合成参数</p><details><summary>限制与后续接入</summary><p>未建模退货、税费、固定成本、融资、日内资金、真实需求反馈与概率分布。先作为独立工具；Pi adapter 与 JuanerAI 插件均属方案规划，本演示没有接入真实 Pi / LLM。</p></details></section>`;}
function versions(){return `<div class="subhead"><h2>检查当前稿，固定可复核快照</h2></div><div class="status-list">${[['输入参数有效',(()=>{try{validateParams(state.params);return true;}catch{return false;}})(),'所有字段有范围、单位与整数规则'],['当前口径确认',state.confirmed===state.revision,'修改目标或参数后旧确认失效'],['运行与工作稿一致',isCurrent()&&!state.formDirty,'必须重跑后才能固定当前版本'],['当前计算守恒',isCurrent()&&state.run?.payload.validationPassed,'运行通过不代表业务假设成立']].map(([l,pass,n])=>`<div class="status-row"><b>${pass?'✓':'○'}</b><div>${l}<small>${n}</small></div>${tag(pass?'通过':'待处理',pass?'':'warn')}</div>`).join('')}</div>${reviewBlock()}<div class="scope-note"><strong>固定快照保存什么</strong><p>工作稿参数与目标、确认版本、模型身份、三方案结果、日账、敏感性与限制说明。后续修改只影响工作稿；旧快照内容保持不变。</p></div>${btn('固定当前实验快照','snapshot','primary',isCurrent()&&state.confirmed===state.revision&&!state.formDirty&&!unresolved()&&state.status!=='running'?'':'disabled')}<section class="subsection" style="margin-top:24px"><div class="subhead"><h3>已固定快照</h3><span class="fine">仅存本浏览器 · 最多 10 份</span></div>${state.snapshots.length?state.snapshots.map((s,i)=>`<div class="snapshot"><div><strong>${s.id} · 工作稿 r${s.revision}</strong><p>${s.run.payload.id} · ${new Date(s.createdAt).toLocaleString('zh-CN')}<br>固定时数据均为合成演示数据</p></div>${btn('下载历史快照','snapshot-export','small',`data-index="${i}"`)}</div>`).join(''):'<p class="fine">尚未固定快照。</p>'}</section><details class="fault"><summary>运行状态演示（故障注入）</summary><p>只用于评审取消、失败和结果未知的行为。不会连接真实服务。</p><label for="faultMode">下一次运行返回</label><select id="faultMode"><option value="normal" ${state.fault==='normal'?'selected':''}>正常成功</option><option value="failed" ${state.fault==='failed'?'selected':''}>已知执行失败</option><option value="unknown" ${state.fault==='unknown'?'selected':''}>计算完成但回执丢失（结果未知）</option></select></details>${state.receipt?`<p class="mono">${esc(JSON.stringify(state.receipt))}</p>`:''}<p class="note">${storageOK?'已启用本浏览器本地存储。清理浏览器数据会删除工作稿与快照；请下载 JSON 留存。':'本地存储不可用，当前只保存在内存。请下载 JSON 留存。'}</p>`;}
function modal(title,body,footer=''){modalTrigger=document.activeElement;$('modal').innerHTML=`<div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="icon" data-action="close" aria-label="关闭弹窗">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer||btn('知道了','close','primary')}</div>`;$('modal').showModal();}
function close(){if($('modal').open)$('modal').close();modalTrigger?.focus?.();}
function changeParams(p,description){state.params=clone(p);state.revision++;state.confirmed=null;state.formDirty=false;event('draft.changed',description);persist();}
function requestCreate(force=false){const text=$('goal')?.value.trim()||'';const sample=SAMPLE.find(s=>s.text===text);if(!sample){$('homeError').innerHTML='<div class="error">这段输入不在起步演示脚本中，尚未生成草稿。请点击一个起步样例，生成后用参数页或支持的修改句式调整。未调用模型理解自由文本。</div>';return;}if(state.experiment&&!force){modal('开始另一份演示草稿？','<p>本演示仅维护一份当前工作稿。继续将替换当前稿；已固定的快照仍保留。需要保留当前结果时，请先导出。</p>',btn('返回','close')+btn('替换当前工作稿','replace-draft','primary'));state.pendingGoal=text;return;}
state.experiment=true;state.goal=text;state.params={...DEFAULTS,demandShock:sample.demandShock,supplyShock:sample.supplyShock};state.revision=1;state.confirmed=null;state.proposal=null;state.run=null;state.status='idle';state.unknownResult=null;state.formDirty=false;state.chat=[{role:'assistant',text:'已将这个预设样例映射到促销与履约模型。数值来自 v0.1 合成默认值，不是从自然语言推断的业务事实。请先确认口径。'}];state.screen='work';state.tab='overview';event('draft.created','scripted sample');render();}
function propose(text){if(state.status==='running'||unresolved()){toast('先处理当前运行状态。');return;}text=text.trim();if(!text){toast('请输入修改内容。');return;}state.chat.push({role:'user',text});if(text==='解释当前风险'){state.chat.push({role:'assistant',text:state.run?`依据 ${state.run.payload.id} / r${state.run.revision}。${!isCurrent()?'这是历史结果，当前稿需重跑。':''}${explain(state.run.payload,state.selected)}`:'还没有运行结果。我只能说明规则，不能编造风险数值。请先确认口径并运行。'});render();return;}
let patch={};const alias={'基准需求':'demand','日发货能力':'capacity','初始现金':'cash','额外备货':'extraStock','采购提前期':'leadTime','促销增幅':'promo','最大等待':'maxWait'};const m=text.match(/^将(基准需求|日发货能力|初始现金|额外备货|采购提前期|促销增幅|最大等待)改为\s*(\d+(?:\.\d+)?)\s*$/);const toggle=text.match(/^(开启|关闭)(需求冲击|供货延迟)$/);if(m)patch[alias[m[1]]]=Number(m[2]);else if(toggle)patch[toggle[2]==='需求冲击'?'demandShock':'supplyShock']=toggle[1]==='开启';else{state.chat.push({role:'assistant',text:'这段输入不在演示脚本支持范围内，未创建修改建议。可使用“将日发货能力改为300”“关闭供货延迟”，或直接在参数页编辑。多仓、退货与自动求最优不在当前模型中。'});render();return;}
try{validateParams({...state.params,...patch});}catch(e){state.chat.push({role:'assistant',text:'参数不合法，未执行：'+e.message});render();return;}
if(Object.entries(patch).every(([k,v])=>state.params[k]===v)){state.chat.push({role:'assistant',text:'当前工作稿已经是这个值，不需要修改或重跑。'});render();return;}
const before=buildRun(state.params,0).results.baseline.summary,after=buildRun({...state.params,...patch},0).results.baseline.summary;
state.proposal={id:'P-'+Date.now(),baseRevision:state.revision,before:Object.fromEntries(Object.keys(patch).map(k=>[k,state.params[k]])),patch,impact:{cash:after.minCash-before.minCash,contribution:after.contribution-before.contribution,cancelled:after.cancelled-before.cancelled},note:patch.capacity!==undefined?'修改能力也会改变分批方案的接单上限；这是政策修改，不是单变量敏感性。':patch.demand!==undefined?'修改基准需求会同步改变固定采购批量；单变量敏感性仍冻结原政策。':'其余参数与方案规则保持当前定义。'};event('proposal.created',{patch,baseRevision:state.revision});render();}
function run(){if(!canRun()){toast(unresolved()?'运行结果未知，请先查询回执。':'请先保存参数并确认当前口径。');return;}const p=clone(state.params),rev=state.revision,fault=state.fault,seq=++state.sequence,operationId='OP-'+String(seq).padStart(3,'0');state.receipt={operationId,revision:rev,status:'running',executionStarted:false,idempotencyKey:operationId};state.status='running';state.unknownResult=null;event('run.admitted',operationId);render();
runTimer=setTimeout(()=>{state.receipt.executionStarted=true;if(fault==='failed'){state.status='failed';state.receipt.status='failed';state.receipt.reason='DEMO_EXECUTION_FAILURE';event('run.failed',operationId);render();return;}try{const result={revision:rev,payload:buildRun(p,seq)};if(!result.payload.validationPassed)throw Error('守恒未通过');if(fault==='unknown'){state.unknownResult=result;state.status='unknown';state.receipt.status='unknown';state.receipt.reason='DEMO_RECEIPT_LOST';event('run.unknown',operationId);}else{state.run=result;state.status='succeeded';state.receipt.status='succeeded';state.tab='results';event('run.succeeded',operationId);}}catch(e){state.status='failed';state.receipt.status='failed';state.receipt.reason=e.message;event('run.failed',operationId);}render();},900);}
function cancel(){if(state.status!=='running')return;clearTimeout(runTimer);state.status='cancelled';state.receipt.status='cancelled';state.receipt.executionStarted=false;state.receipt.reason='CANCELLED_BEFORE_EXECUTION';event('run.cancelled',state.receipt.operationId);render();}
function saveParams(){const form=$('paramForm');if(!form)return;let p={...state.params};for(const [k] of FIELDS){const el=$(k);if(el.value.trim()===''){el.setAttribute('aria-invalid','true');$('paramError').textContent=FIELD_MAP[k][1]+'不能为空；未执行，原参数未变。';el.focus();return;}p[k]=Number(el.value);}p.demandShock=$('demandShock').checked;p.supplyShock=$('supplyShock').checked;try{validateParams(p);}catch(e){$('paramError').textContent='参数错误，未执行：'+e.message;return;}if(JSON.stringify(p)!==JSON.stringify(state.params)){changeParams(p,'manual parameters');toast('参数已保存。旧口径确认失效，需重新运行。');}else{state.formDirty=false;toast('参数没有变化。');}render();}
function confirm(){if(state.formDirty||state.status==='running'||unresolved()){toast('先保存参数并处理当前运行状态。');return;}modal('确认当前实验口径',`<p>将确认工作稿 <strong>r${state.revision}</strong> 的假设和范围：</p><ol><li>30 天、单品单仓、FIFO；货发收款、采购下单付款。</li><li>D0 额外现货真实可得性尚待业务验证；初始库存期前已付。</li><li>三方案共享同一外部环境；现金与贡献毛利分开。</li><li>所有参数合成，结果不等于预测、因果效果或执行批准。</li></ol><p>修改目标或参数会使本确认失效。确认后仍需主动运行。</p>`,btn('继续修改','close')+btn('确认当前口径','confirm-commit','primary'));}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCurrent(){if(!isCurrent()||state.formDirty){toast('当前稿没有一致的结果，请重新运行。');return;}download({demo:true,demoVersion:'0.2',agentMode:'scripted-no-Pi-no-LLM',coreSHA256:CORE_HASH,goal:state.goal,revision:state.revision,confirmedRevision:state.confirmed,...clone(state.run.payload),view:{scenario:state.selected,day:state.day}},'SimLab-'+state.run.payload.id+'-r'+state.revision+'.json');}
function snapshot(){if(!isCurrent()||state.formDirty||state.confirmed!==state.revision||unresolved())return;if(state.snapshots.some(s=>s.run.payload.id===state.run.payload.id&&s.revision===state.revision)){toast('此运行已经固定，无需重复快照。');return;}if(state.snapshots.length>=10){toast('演示最多保存 10 份快照，请先下载留存。');return;}state.snapshots.push(clone({demo:true,id:'SNAP-'+String(state.snapshots.length+1).padStart(3,'0'),createdAt:new Date().toISOString(),goal:state.goal,revision:state.revision,confirmedRevision:state.confirmed,coreSHA256:CORE_HASH,run:state.run}));event('snapshot.created',state.snapshots.at(-1).id);render();toast('已固定。之后修改工作稿不会改变这个快照。');}
function ledger(){if(!state.run)return;const r=state.run.payload,x=r.results[state.selected];modal('逐日账 · '+SCENARIOS.find(s=>s.id===state.selected).name,`<p class="fine">${r.id} / r${state.run.revision} · 全部合成数据。D0 额外备货付款 ${money(x.summary.extraStock*r.parameters.cost)}，期初现金 ${money(x.summary.openingCash)}。</p><div class="table-scroll"><table aria-label="完整逐日账"><thead><tr><th>日</th><th>到货</th><th>需求</th><th>接单</th><th>发货</th><th>取消</th><th>现货</th><th>队列</th><th>在途</th><th>采购付款</th><th>日末现金</th></tr></thead><tbody>${x.records.map(d=>`<tr><td>D${d.day}</td>${[d.received,d.demand,d.accepted,d.shipped,d.cancelled,d.inventory,d.backlog,d.inTransit,d.purchasePayment,d.cash].map(v=>`<td>${fmt(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="note">完整原精度数据、采购订单、未完成队列与守恒残差见运行 JSON。界面仅格式化显示。</p>`);}
function about(){modal('SimLab v0.2 · 演示说明','<p><strong>可体验：</strong>预设自然语言起步、同一工作稿、结构化修改、原内核影响预览、采纳 / 放弃、口径失效、三方案运行、日账、敏感性与历史快照。</p><p><strong>真实计算：</strong>完整复用 v0.1 确定性 FIFO 内核。界面 v0.2 不改变公式。所有输入与解释均为合成演示。</p><p><strong>规划：</strong>复用 metric-factory 当前的 pi-agent-runtime@0.4.3 中立接口，未来使用其工具循环与会话，不另造循环。本演示没有导入 SDK、读取密钥、调用 Pi / LLM、执行真实采购或部署。</p><p>视觉与工作流参考 metric-factory 当前 UI 及 2026-10-18 认可原型。先为独立工具，JuanerAI 插件为后续接缝；不要求完整本体、双库或 Model Pack。</p><p>本地存储只用于演示，不是正式审计系统。取消仅保证计算开始前的停止；同步计算开始后没有物理中断能力。故障注入用于体验结果未知的查询流程。</p>');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;
 if(state.formDirty&&!['save-params','discard-edit','about','close','menu'].includes(a)){toast('先保存或放弃参数编辑，避免丢失未保存的值。');return;}
 if((state.status==='running'||unresolved())&&['create','use-template','replace-draft','adopt','save-params','edit-goal','save-goal'].includes(a)){toast('先处理当前运行状态，再修改工作稿。');return;}
 if(a==='close'){close();return;}if(a==='about'){about();return;}if(a==='menu'){$('sidebar').classList.toggle('open');return;}
 if(a==='home'){if(state.status==='running'||unresolved()){toast('先处理当前运行状态。');return;}state.screen='home';render();}
 else if(a==='work'){state.screen='work';render();}
 else if(a==='templates'){state.screen='templates';render();}
 else if(a==='sample'){$('goal').value=SAMPLE[Number(el.dataset.index)].text;$('goal').focus();$('homeError').innerHTML='';}
 else if(a==='create')requestCreate();
 else if(a==='use-template'){state.screen='home';render();$('goal').value=SAMPLE[0].text;requestCreate();}
 else if(a==='replace-draft'){const goal=state.pendingGoal;close();state.screen='home';render();$('goal').value=goal;requestCreate(true);}
 else if(a==='tab'){if(state.formDirty){toast('请先保存或放弃参数编辑。');return;}state.tab=el.dataset.tab;render();}
 else if(a==='confirm')confirm();
 else if(a==='confirm-commit'){state.confirmed=state.revision;event('caliber.confirmed',state.revision);close();render();toast('当前口径已确认，可以运行实验。');}
 else if(a==='suggest')propose(el.dataset.text);
 else if(a==='refine')propose($('refine').value);
 else if(a==='adopt'){const p=state.proposal;if(!p||p.baseRevision!==state.revision){toast('建议已过期，请重新提出修改。');return;}changeParams({...state.params,...p.patch},'adopt proposal '+p.id);state.proposal=null;state.chat.push({role:'assistant',text:'修改已采纳到同一工作稿。旧口径确认已失效；原运行保持不变，需确认后重跑。'});render();}
 else if(a==='discard-proposal'){state.proposal=null;event('proposal.discarded','no draft mutation');render();toast('建议已放弃，工作稿未变。');}
 else if(a==='save-params')saveParams();
 else if(a==='discard-edit'){state.formDirty=false;render();toast('未保存编辑已放弃。');}
 else if(a==='run')run();
 else if(a==='cancel')cancel();
 else if(a==='reconcile'){if(state.unknownResult){state.run=clone(state.unknownResult);state.unknownResult=null;state.status='succeeded';state.receipt.status='succeeded';state.receipt.reconciled=true;state.tab='results';event('run.reconciled',state.receipt.operationId);render();toast('已查询到同一操作的成功回执，没有再次计算。');}else{toast('本浏览器没有可确认的执行回执；保持结果未知，不自动重试。');}}
 else if(a==='scenario'){state.selected=el.dataset.scenario;render();}
 else if(a==='chart'){state.chart=el.dataset.chart;render();}
 else if(a==='risk-day'){state.day=Number(el.dataset.day);state.tab='results';render();}
 else if(a==='ledger')ledger();
 else if(a==='export')exportCurrent();
 else if(a==='snapshot')snapshot();
 else if(a==='snapshot-export'){const s=state.snapshots[Number(el.dataset.index)];if(s)download(s,'SimLab-'+s.id+'-historical.json');}
 else if(a==='edit-goal')modal('修正经营目标',`<label for="goalEdit">当前目标</label><textarea id="goalEdit" style="width:100%;min-height:130px;margin-top:10px">${esc(state.goal)}</textarea><p class="fine">这里只编辑工作稿文本，不会假装理解或改变参数。保存使口径确认失效。</p>`,btn('取消','close')+btn('保存目标','save-goal','primary'));
 else if(a==='save-goal'){const v=$('goalEdit').value.trim();if(!v){toast('经营目标不能为空。');return;}if(v!==state.goal){state.goal=v;state.revision++;state.confirmed=null;event('goal.changed','text only');}close();render();}
